# cargo-deny: supply-chain policy. CI fails on any advisory, any unknown licence, any duplicate crate version
# that is not allow-listed, and any source outside crates.io.
[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode 1.3.3 unmaintained (RUSTSEC-2025-0141): transitive via solana-program/anchor; not reachable from
    # program code; tracked for removal when upstream bumps.
    { id = "RUSTSEC-2025-0141", reason = "transitive via solana-program/anchor; not reachable from program code; tracked for removal when upstream bumps" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BUSL-1.1"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path dependencies (vernier, brink_index) carry no version by design
highlight = "all"
deny = [
  { crate = "openssl", reason = "no native TLS in programs or clients" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
