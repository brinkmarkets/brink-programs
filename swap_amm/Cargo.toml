[package]
name = "swap_amm"
version = "0.1.0"
description = "Brink singleton rates AMM: pools, swaps, hooks, flash accounting and settlement on Solana"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "swap_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
anchor-debug = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "brink_index/idl-build", "brink_venue/idl-build"]
test-mint = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
anchor-spl = { workspace = true }
vernier = { workspace = true, features = ["anchor"] }
brink_index = { path = "../brink_index", features = ["cpi"] }
brink_venue = { path = "../brink_venue", features = ["cpi"] }

[dev-dependencies]
proptest = "1.5"

[lints]
workspace = true
