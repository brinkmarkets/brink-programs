[package]
name = "brink_svm_tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end tests for the Brink programs on LiteSVM, driven through the compiled .so files"

# Detached from the programs workspace on purpose: the test harness tracks the Agave/LiteSVM crate versions,
# the programs track Anchor's. The .so files under ../../target/deploy are the only contract between them.
[workspace]

[dependencies]
litesvm = "0.17"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-pubkey = { version = "3", features = ["borsh"] }
solana-instruction = "3.5"
solana-message = "4.2"
solana-transaction = "4.1"
solana-account = "4.3"
solana-clock = "3.2"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-program-pack = "3"
spl-token-interface = "3"
spl-associated-token-account-interface = "2"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
# bootstrap rehearsal (tests/bootstrap.rs): reads the plan written by deploy/init-devnet.mjs --plan
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[lib]
path = "src/lib.rs"
