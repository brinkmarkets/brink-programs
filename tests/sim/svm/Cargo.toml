[package]
name = "brink_sim_svm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Slow layer: seeded scenarios and adversarial sequences against the compiled Brink programs on LiteSVM"

[lib]
path = "src/lib.rs"

[dependencies]
brink_sim_core = { path = "../core" }
vernier = { path = "../../../vernier", default-features = false }
litesvm = "0.17"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-pubkey = { version = "3", features = ["borsh"] }
solana-instruction = "3.5"
solana-message = "4.2"
solana-transaction = "4.1"
solana-account = "4.3"
solana-clock = "3.2"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-program-pack = "3"
spl-token-interface = "3"
spl-associated-token-account-interface = "2"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
